version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/jorgesanchez-e/localenvironment/pkg/grpc
plugins:
  - local: protoc-gen-go
    out: ../../pkg/grpc
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../../pkg/grpc
    opt: paths=source_relative