syntax = "proto3";

package notifier.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/jorgesanchez-e/localenvironment/pkg/grpc/notifier/v1;notifierv1";

service NotifierService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
}

enum MessageSeverity {
  MESSAGE_SEVERITY_UNSPECIFIED = 0;
  MESSAGE_SEVERITY_INFO = 1;
  MESSAGE_SEVERITY_ERROR = 2;
  MESSAGE_SEVERITY_FATAL = 3;
  MESSAGE_SEVERITY_DEBUG = 4;
}

message SendMessageRequest {
  string application = 1;
  string title = 2;
  string message = 3;
  MessageSeverity severity = 4;
  google.protobuf.Timestamp time_stamp = 5;
}

enum MessageStatusResponse {
  MESSAGE_STATUS_RESPONSE_UNSPECIFIED = 0;
  MESSAGE_STATUS_RESPONSE_OK = 1;
  MESSAGE_STATUS_RESPONSE_FAILED = 2;
}

message SendMessageResponse {
  MessageStatusResponse status = 1;
}
