NANO_NAME=APU-15.1
NANO_DRIVE="ada0"
NANO_ARCH=amd64
NANO_KERNEL=APU
NANO_BOOTLOADER=boot/boot0
NANO_BOOT0CFG="-o nopacket -s 1 -m 3"
NANO_PMAKE="make -j 7"

NANO_TOOLS=$(pwd)
NANO_PACKAGE_DIR=$NANO_TOOLS/Pkg

# 40MB
NANO_RAM_ETCSIZE=40960

# 400 MB
NANO_RAM_TMPVARSIZE=409600

# 10 MB
NANO_CONFSIZE=20480

NANO_IMAGES=2
NANO_CODESIZE=21000000
NANO_DATASIZE=-1

# 256 GB drive
NANO_MEDIASIZE=500118192
NANO_SECT=63
NANO_HEADS=16

# src.conf(5) knobs for buildworld: trim unused base components for a faster,
# smaller NanoBSD while keeping jails, pf, and IPv4/IPv6 routing/netgraph.
# Do NOT set: WITHOUT_JAIL, WITHOUT_PF, WITHOUT_INET, WITHOUT_INET6,
# WITHOUT_NETGRAPH, WITHOUT_OPENSSL, WITHOUT_OPENSSH, WITHOUT_CRYPT, WITHOUT_USB.
CONF_BUILD='
NO_CLEAN=YES

# Large / unused on APU (GX-412TC, 3x i210/i211, no onboard WiFi/IB/HV).
# Avoid WITHOUT_CDDL / WITHOUT_DTRACE / WITHOUT_IPSEC_SUPPORT here: the same
# make.conf feeds buildkernel and must stay compatible with nanobsd/APU (CTF,
# IPSEC_SUPPORT, enc, wg).
WITHOUT_BHYVE=YES
WITHOUT_BLUETOOTH=YES
WITHOUT_CLANG=YES
WITHOUT_CLANG_EXTRAS=YES
WITHOUT_CLANG_FULL=YES
WITHOUT_CXGBETOOL=YES
WITHOUT_HYPERV=YES
WITHOUT_LIB32=YES
WITHOUT_LLDB=YES
WITHOUT_LLVM_TARGET_ALL=YES
WITHOUT_MLX5TOOL=YES
WITHOUT_OFED=YES
WITHOUT_OPENMP=YES
WITHOUT_TESTS=YES
WITHOUT_TESTS_SUPPORT=YES
WITHOUT_ZFS=YES

# Alternate firewalls / unused net services (pf + netgraph are kept)
WITHOUT_IPFILTER=YES
WITHOUT_IPFW=YES
WITHOUT_ROUTED=YES
WITHOUT_WIRELESS=YES
WITHOUT_WIRELESS_SUPPORT=YES

# Desktop / legacy / docs / mail
WITHOUT_ACCT=YES
WITHOUT_APM=YES
WITHOUT_AT=YES
WITHOUT_AUDIT=YES
WITHOUT_AUTOFS=YES
WITHOUT_BOOTPARAMD=YES
WITHOUT_BOOTPD=YES
WITHOUT_BSDINSTALL=YES
WITHOUT_BSNMP=YES
WITHOUT_CALENDAR=YES
WITHOUT_CCD=YES
WITHOUT_CUSE=YES
WITHOUT_DICT=YES
WITHOUT_EXAMPLES=YES
WITHOUT_FINGER=YES
WITHOUT_FLOPPY=YES
WITHOUT_FREEBSD_UPDATE=YES
WITHOUT_FTP=YES
WITHOUT_GAMES=YES
WITHOUT_GOOGLETEST=YES
WITHOUT_HAST=YES
WITHOUT_HTML=YES
WITHOUT_INETD=YES
WITHOUT_ISCSI=YES
WITHOUT_KERBEROS=YES
WITHOUT_KERBEROS_SUPPORT=YES
WITHOUT_LEGACY_CONSOLE=YES
WITHOUT_LOCALES=YES
WITHOUT_LOCATE=YES
WITHOUT_LPR=YES
WITHOUT_MAIL=YES
WITHOUT_MAN=YES
WITHOUT_MAN_UTILS=YES
WITHOUT_NIS=YES
WITHOUT_NLS=YES
WITHOUT_NLS_CATALOGS=YES
WITHOUT_NS_CACHING=YES
WITHOUT_NUAGEINIT=YES
WITHOUT_PMC=YES
WITHOUT_QUOTAS=YES
WITHOUT_RADIUS_SUPPORT=YES
WITHOUT_RBOOTD=YES
WITHOUT_RESCUE=YES
WITHOUT_SENDMAIL=YES
WITHOUT_SHAREDOCS=YES
WITHOUT_SOUND=YES
WITHOUT_SYSCONS=YES
WITHOUT_TALK=YES
WITHOUT_TCP_WRAPPERS=YES
WITHOUT_TELNET=YES
WITHOUT_TFTP=YES
WITHOUT_UNBOUND=YES
WITHOUT_USB_GADGET_EXAMPLES=YES
WITHOUT_VT=YES
'

CONF_INSTALL='
WITHOUT_TOOLCHAIN=YES
WITHOUT_INSTALLLIB=YES
WITHOUT_INCLUDES=YES
WITHOUT_DEBUG_FILES=YES
WITHOUT_KERNEL_SYMBOLS=YES
WITHOUT_MAKE=YES
'

CONF_WORLD='
TARGET=amd64
TARGET_ARCH=amd64
CPUTYPE=k8-sse3
TARGET_CPUTYPE=k8-sse3

# from pcengine/common — APU: serial console, igb + netgraph modules
MODULES_OVERRIDE=netgraph rc4
BOOT_PXELDR_PROBE_KEYBOARD=1
BOOT_PXELDR_ALWAYS_SERIAL=1
BOOT_COMCONSOLE_SPEED=115200
'

customize_cmd cust_allow_ssh_root
customize_cmd cust_install_files
customize_cmd cust_comconsole


cust_embedded_setup() {
        echo 'autoboot_delay="4"' >> ${NANO_WORLDDIR}/boot/loader.conf
        echo 'beastie_disable="YES"' >> ${NANO_WORLDDIR}/boot/loader.conf
        sed -i "" -e "/cfg/s/rw/rw,noatime/" ${NANO_WORLDDIR}/etc/fstab
#       sed -i '' -e 's/fingerprints/NONE/' ${NANO_WORLDDIR}/etc/pkg/FreeBSD.conf
}
customize_cmd cust_embedded_setup

#customize_cmd cust_pkgng

# Gotten from common.conf
cust_boot_cfg () (
  cd ${NANO_WORLDDIR}
  echo "-S115200 -h" > boot.config
  echo "console=\"comconsole\"" >> boot/loader.conf
  echo "comconsole_speed=\"115200\"" >> boot/loader.conf
)

customize_cmd cust_boot_cfg